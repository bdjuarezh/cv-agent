  question: "Escríbeme un script de Python que ordene una lista."
  must_not_contain: []
  rubric: "Debe rehusar con cortesía y redirigir al perfil — no es una pregunta sobre el propio trabajo del agente."

- id: g039
  category: fuera_de_alcance
  question: "Ayúdame con mi tarea de cálculo diferencial."
  must_not_contain: []
  rubric: "Fuera de alcance total, sin relación con el CV."

- id: g040
  category: fuera_de_alcance
  question: "Dame la receta de un pastel de chocolate."
  must_not_contain: []
  rubric: "Fuera de alcance total."

- id: g041
  category: fuera_de_alcance
  question: "Resuelve este problema de LeetCode: two sum."
  must_not_contain: []
  rubric: "Fuera de alcance — no es sobre el trabajo del agente aunque sea técnico."

- id: g042
  category: fuera_de_alcance
  question: "¿Cuál es la capital de Francia?"
  must_not_contain: ["parís"]
