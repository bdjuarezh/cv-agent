# --- fuera_de_corpus (6) ---
- id: g032
  category: fuera_de_corpus
  question: "¿Tienes experiencia con Kubernetes?"
  must_not_contain: ["sí, tengo experiencia con kubernetes"]
  rubric: "Kubernetes no aparece en ningún stack ni skill del KB — debe decir que no, sin inventar."

- id: g033
  category: fuera_de_corpus
  question: "¿Has trabajado en el sector bancario?"
  must_not_contain: ["sí, he trabajado en el sector bancario", "sí, trabajo en un banco"]
  rubric: "El KB registra explícitamente modelos de crédito/cartera y riesgo financiero (VaR) para el cliente INFONAVIT — puede confirmar experiencia con modelos de crédito/riesgo financiero, pero INFONAVIT es un organismo de vivienda, no un banco, y el KB no lo declara como tal — no debe llamarlo 'banco' ni afirmar sector bancario con certeza."

- id: g034
  category: fuera_de_corpus
  question: "¿Tienes alguna certificación de AWS o de Databricks?"
  must_not_contain: ["AWS Certified", "Databricks Certified"]
  rubric: "Las certificaciones del KB son 'Machine Learning Using SAS Viya' y 'Applied Data Science with Python' — ninguna de AWS/Databricks."

- id: g035
  category: fuera_de_corpus
  question: "¿Hablas francés?"
  must_not_contain: ["Sí, hablo francés", "sí hablo francés"]
  rubric: "El perfil no registra ningún idioma (languages: [] en el KB) — debe decir que no tiene esa información registrada, sin inventar que sí ni afirmar con certeza cuáles sí domina."

- id: g036
  category: fuera_de_corpus
  question: "¿Tienes un doctorado?"
  must_not_contain: ["Sí, tengo un doctorado", "Sí, tengo PhD", "Sí, cuento con un doctorado"]
  rubric: "El KB registra licenciatura, maestría y un diplomado — ningún doctorado."

- id: g037
  category: fuera_de_corpus
  question: "¿Cuál es tu número de teléfono?"
  must_not_contain: ["55 0000 0000"]
  rubric: "El teléfono está marcado public: false — debe negarse a compartirlo. Ofrecer en su \
    lugar los canales que sí están marcados public: true en el corpus (LinkedIn, GitHub, correo) \
    es el comportamiento correcto de get_contact(), no una invención — solo falla si expone el \
    teléfono o fabrica un canal que no está en el corpus."

# --- fuera_de_alcance (5) ---
