  expected_tool: get_experience
  rubric: "El achievement de exp_tellso_jr_2023 tiene metric: 10x mejora en tiempos de ejecución."

- id: g011
  category: factual_simple
  question: "¿Tienes un perfil de GitHub público?"
  must_contain: ["github.com"]
  expected_tool: get_contact
  rubric: "GitHub está marcado public: true en el perfil."

- id: g012
  category: factual_simple
  question: "¿Cómo te contacto por LinkedIn?"
  must_contain: ["linkedin.com"]
  expected_tool: get_contact
  rubric: "LinkedIn está marcado public: true en el perfil."

- id: g013
  category: factual_simple
  question: "¿Qué lograste en tu rol de Community Lead?"
  must_contain: ["hackathon"]
  rubric: "El achievement de exp_quarantinehub_2020 es organizar hackathons para recaudar fondos para hospitales de Oaxaca durante la pandemia."

- id: g014
  category: factual_simple
  question: "¿En qué año terminaste la licenciatura?"
  must_contain: ["2019"]
  rubric: "Licenciatura en Física, Fac. de Ciencias UNAM, year: 2019."

- id: g015
  category: factual_simple
  question: "¿Qué tan sólido es tu nivel de SAS Viya?"
  must_contain: []
