# Golden set escrito contra el CV real en data/ (Bryan David Juárez Hernández).
# Distribución: 15 factual, 8 temporal, 8 comparativa/abierta, 6 fuera de corpus,
# 5 fuera de alcance, 4 inyección, 4 ambigua.

# --- factual_simple (15) ---
- id: g001
  category: factual_simple
  question: "¿En qué empresa trabajas actualmente?"
  must_contain: ["Tellso"]
  rubric: "Debe nombrar la empresa del rol activo (end: null)."

- id: g002
  category: factual_simple
  question: "¿Cuál es tu rol actual?"
  must_contain: ["Científico de Datos Sr"]
  rubric: "Debe coincidir con el rol de la experiencia sin end."

- id: g003
  category: factual_simple
  question: "¿Cuál era tu puesto justo antes del actual?"
  must_contain: ["Jr"]
  rubric: "Antes de Científico de Datos Sr. (2026-06) fue Científico de Datos Jr., misma empresa (Tellso)."

- id: g004
  category: factual_simple
  question: "¿Qué hiciste en tu rol de Analista de Datos en Defoe?"
  must_contain: ["Tableau"]
  expected_tool: get_experience
  rubric: "El resumen de exp_defoe_2022 menciona dashboards en Tableau, Highcharts y R Shiny."

- id: g005
  category: factual_simple
  question: "¿Cuál fue tu logro más importante en tu rol actual?"
  must_contain: ["RAG"]
  rubric: "Debe mencionar el chatbot de consulta documental con infraestructura RAG end-to-end en IBM Cloud."

- id: g006
  category: factual_simple
  question: "¿En qué universidad estudiaste?"
  must_contain: ["UNAM"]
  rubric: "Las tres entradas de education son de la UNAM (Fac. de Ciencias / IIMAS)."

- id: g007
  category: factual_simple
  question: "¿En qué institución hiciste tu maestría?"
  must_contain: ["IIMAS"]
  rubric: "Maestría en Ciencias de la Computación en IIMAS, UNAM (2020-2022)."

- id: g008
  category: factual_simple
  question: "¿Qué tan avanzado es tu nivel de RAG?"
  must_contain: []
  rubric: "RAG (retrieval-augmented generation) tiene level 4/5 en skills.yaml."

- id: g009
  category: factual_simple
  question: "¿Qué stack usabas en tu rol en Defoe?"
  must_contain: ["YOLO"]
  rubric: "El stack de exp_defoe_2022 incluye r, tableau, highcharts, r shiny, yolo, visión computacional."

- id: g010
  category: factual_simple
  question: "¿Qué resultado tuvo tu migración de R a SQL en Tellso?"
