# PLANTILLA — 20 ids de golden.yaml para validar al juez (ARCHITECTURE.md §5).
#
# Cómo llenarla:
# 1. Corre `make eval` al menos una vez (necesita el proveedor real configurado). Se genera
#    evals/results/<timestamp>.json.
# 2. Para cada id de abajo, lee la pregunta y la respuesta real que dio el agente en ese json.
# 3. Reemplaza `correct: null` por `true` o `false` — tu propio juicio sobre si la respuesta es
#    correcta según la rúbrica de golden.yaml, SIN ver el veredicto del juez todavía.
# 4. `evals/run.py` compara tus 20 labels contra el veredicto del juez en esos mismos casos y
#    reporta el kappa de Cohen. Si kappa < 0.6, el juez no sirve — itera su rúbrica
#    (evals/judge.py::JUDGE_SYSTEM_PROMPT) antes de confiar en los números agregados.

